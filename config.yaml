# job-radar 2.0 configuration. Edit freely.

# ---------------------------------------------------------------------------
# WHERE TO SEARCH (country-based)
# Every term below runs in every country. `location` is free text for LinkedIn/Google,
# `country` drives Indeed/Glassdoor (JobSpy names, lowercase). Unsupported combinations
# are skipped automatically. Comment a country out to save time.
# ---------------------------------------------------------------------------
countries:
  - { country: "germany",     location: "Germany" }      # EU Blue Card, low IT threshold
  - { country: "netherlands", location: "Netherlands" }  # kennismigrant (recognised sponsors)
  - { country: "ireland",     location: "Ireland" }      # Critical Skills permit
  - { country: "france",      location: "France" }       # French speaker, Talent Passport
  - { country: "belgium",     location: "Belgium" }      # French speaker
  - { country: "luxembourg",  location: "Luxembourg" }   # French speaker
  - { country: "spain",       location: "Spain" }
  - { country: "portugal",    location: "Portugal" }
  - { country: "sweden",      location: "Sweden" }
  - { country: "denmark",     location: "Denmark" }
  - { country: "austria",     location: "Austria" }
  - { country: "italy",       location: "Italy" }
  - { country: "finland",     location: "Finland" }
  - { country: "poland",      location: "Poland" }
  - { country: "switzerland", location: "Switzerland" }

# Role terms searched in every country above.
terms:
  - "software engineer"
  - "backend engineer"
  - "AI engineer"
  - "cloud engineer"
  - "python developer"
  - "typescript developer"
  - "devops engineer"
  - "LLM engineer"

# Extra queries that put sponsorship words INTO the search, so boards rank sponsoring
# employers first. Applied to the first `sponsor_query_terms` terms only.
sponsor_query_templates:
  - "{term} visa sponsorship"
  - "{term} relocation"
sponsor_query_terms: 1

# Optional one-off searches (e.g. a specific city), same shape as before.
extra_searches: []
  # - { term: "software engineer", location: "Berlin, Germany", country: "germany" }

# Job boards scraped through JobSpy. "google" aggregates many smaller boards.
sites: ["linkedin", "indeed", "glassdoor", "google"]
hours_old: 72           # with seen-state below, 72h is safe for daily/every-2-days runs
results_per_search: 40  # keep modest: boards rate-limit aggressive scraping
delay_between_searches: 4   # seconds
linkedin_fetch_description: true   # slower, but needed for sponsorship/language detection

# ---------------------------------------------------------------------------
# EXTRA SOURCES (free APIs / relocation boards). All are optional.
# ---------------------------------------------------------------------------
extra_sources:
  arbeitnow:     # Germany-focused, English-friendly, often tags visa sponsorship. No key needed.
    enabled: true
    pages: 4
  relocateme:    # relocate.me: every job there offers relocation. Best-effort HTML scraper.
    enabled: true
    queries: ["software engineer", "backend", "AI", "cloud", "devops", "python"]
  remotive:      # remote jobs (filtered to worldwide / Europe / your countries)
    enabled: true
  remoteok:
    enabled: true
  himalayas:
    enabled: true
    pages: 5
  adzuna:        # needs a free key from developer.adzuna.com (or env ADZUNA_APP_ID / ADZUNA_APP_KEY)
    enabled: false
    app_id: ""
    app_key: ""
    terms: 2

# Remote jobs are kept only if their location text contains one of these (plus your countries).
remote_allowed_regions: ["worldwide", "anywhere", "global", "europe", "emea", "eu", "european union", "european"]

# Optional text file, one company per line (e.g. exported Dutch IND recognised sponsors,
# UK/Ireland sponsor lists). Matching companies get a visa boost. Leave "" to disable.
sponsor_companies_file: ""

# ---------------------------------------------------------------------------
# FILTERS
# ---------------------------------------------------------------------------
# Whole-word, case-insensitive. Title must contain at least one include term.
title_include: ["engineer", "developer", "backend", "full stack", "fullstack", "full-stack",
                "ai", "llm", "ml", "machine learning", "cloud", "devops", "platform", "software",
                "python", "typescript"]
# Title containing any of these is dropped.
title_exclude: ["principal", "staff", "lead", "manager", "head of", "director", "vp",
                "intern", "internship", "werkstudent", "working student", "praktikum", "trainee",
                "stagiaire", "alternance", "apprentice",
                "frontend", "front-end", "ios", "android", "sap", "salesforce",
                "embedded", "hardware", "mechanical", "electrical", "civil",
                "qa", "sdet", "sales engineer", "support engineer"]

# Phrases that suggest the employer sponsors or relocates
sponsorship_keywords:
  - "visa sponsorship"
  - "sponsor your visa"
  - "sponsor visa"
  - "sponsor work permits"
  - "visa support"
  - "visa assistance"
  - "visa and relocation"
  - "sponsorship available"
  - "we sponsor"
  - "will sponsor"
  - "can sponsor"
  - "relocation"
  - "relocation package"
  - "relocation support"
  - "relocation assistance"
  - "relocation bonus"
  - "relocation allowance"
  - "we relocate"
  - "blue card"
  - "eu blue card"
  - "work permit"
  - "critical skills"
  - "kennismigrant"
  - "highly skilled migrant"
  - "skilled worker"
  - "tech visa"
  - "umzugsunterstützung"
  - "relocation-unterstützung"
  - "visa-unterstützung"
  - "aide à la relocalisation"
  - "prise en charge du visa"

# Phrases that usually mean visa/work-right filtering (-> job is capped low)
blocker_keywords:
  - "no visa sponsorship"
  - "no sponsorship"
  - "unable to sponsor"
  - "cannot sponsor"
  - "can't sponsor"
  - "will not sponsor"
  - "do not sponsor"
  - "does not sponsor"
  - "not able to sponsor"
  - "without sponsorship"
  - "sponsorship is not available"
  - "not offer visa"
  - "must have the right to work"
  - "right to work in the eu"
  - "right to work in the uk"
  - "unrestricted right to work"
  - "legally entitled to work"
  - "legally authorized to work"
  - "legally authorised to work"
  - "authorized to work in the eu"
  - "authorised to work in the eu"
  - "eu citizenship"
  - "eu citizen"
  - "eu work permit required"
  - "eu work authorization"
  - "valid work permit required"
  - "already based in"
  - "local candidates only"
  - "security clearance"

# Language requirements you can't meet (French and English are fine, German basic only)
language_blockers:
  - "fluent german"
  - "german c1"
  - "german c2"
  - "german (c1"
  - "german (c2"
  - "german required"
  - "german language required"
  - "german native"
  - "native german"
  - "excellent german"
  - "very good german"
  - "good command of german"
  - "business fluent german"
  - "fließend deutsch"
  - "verhandlungssicher"
  - "deutschkenntnisse"
  - "muttersprache"
  - "fluent dutch"
  - "dutch speaking"
  - "native dutch"
  - "vloeiend nederlands"
  - "nederlands vloeiend"
  - "fluent italian"
  - "native italian"
  - "fluent spanish"
  - "native spanish"
  - "fluent swedish"
  - "fluent danish"
  - "fluent portuguese"

# ---------------------------------------------------------------------------
# LOCAL LLM (Ollama). Set enabled: false for keyword scoring only.
# Only the best `max_jobs` keyword-ranked jobs are sent to the model.
# ---------------------------------------------------------------------------
# llm:
#   enabled: true
#   base_url: "http://localhost:11434"
#   model: "qwen2.5:7b"        # qwen2.5:14b scores noticeably better if your GPU/RAM allows
#   max_description_chars: 6000
#   max_jobs: 150
#   num_ctx: 8192
#   timeout: 240
llm:
  enabled: true
  base_url: "http://localhost:11434"
  model: "qwen2.5:14b"       # run once: ollama pull qwen2.5:14b
  max_description_chars: 6000
  max_jobs: 150
  num_ctx: 8192
  timeout: 240
 
min_score_in_report: 50   # jobs scoring below this are hidden from the HTML report
only_new_in_report: false # true = hide jobs already shown in earlier runs
output_dir: "reports"
state_file: "data/seen.json"

min_score_in_report: 50   # jobs scoring below this are hidden from the HTML report
only_new_in_report: false # true = hide jobs already shown in earlier runs
output_dir: "reports"
state_file: "data/seen.json"

# ---------------------------------------------------------------------------
# YOUR PROFILE (used by the LLM) and skills (used for keyword matching)
# ---------------------------------------------------------------------------
profile: |
  Software Engineer, 3+ years (Pixartprinting, since Mar 2023). Backend, AI integrations, cloud automation.
  Built a production multilingual LLM chatbot (Azure OpenAI, LangChain, LangGraph, GraphQL, WebSockets)
  handling 40% of inbound customer chats, and MailBot, an AI email-response system on AWS Bedrock + Lambda.
  Serverless AWS (Lambda, EventBridge, SQS/SNS, DynamoDB, Bedrock), IaC (CDK, CloudFormation, Terraform),
  TypeScript, Python, C#, Snowflake ETL, Zendesk API automation. Also used OpenAI and Anthropic APIs.
  AWS Certified Cloud Practitioner; Solutions Architect Associate in progress.
  Computer Science Engineering degree (ENIS, EUR-ACE accredited).
  English fluent, French fluent, German basic. Prefers roles where English or French is the working language.
  Target level: mid-level (about 3-4 years). Senior roles asking 6+ years are a poor fit.
  Non-EU (Tunisian): needs visa sponsorship to work in the EU.

skills: ["python", "typescript", "javascript", "c#", "aws", "lambda", "eventbridge", "sqs", "sns",
         "dynamodb", "bedrock", "cdk", "cloudformation", "terraform", "serverless", "azure",
         "openai", "llm", "langchain", "langgraph", "rag", "graphql", "websocket", "websockets",
         "snowflake", "etl", "zendesk", "github actions", "ci/cd", "node.js", "nodejs", "docker",
         "microservices", "event-driven", "chatbot", "automation", "genai", "generative ai"]